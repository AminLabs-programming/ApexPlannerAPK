<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#0f172a"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="اپکس پلنر"/>
<title>اپکس پلنر — دستیار کنکور</title>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f172a'/%3E%3Cpath d='M50 20 L78 75 L60 75 L50 52 L40 75 L22 75 Z' fill='%236366f1'/%3E%3C/svg%3E"/>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

<style>
:root {
  /* ── پس‌زمینه‌ها ── */
  --bg-primary: #060914;
  --bg-secondary: #0d1225;
  --bg-tertiary: #151b35;
  --bg-elevated: #1a2142;

  /* ── رنگ اصلی (بنفش نئونی) ── */
  --primary: #7c3aed;
  --primary-bright: #a78bfa;
  --primary-dim: #5b21b6;
  --primary-glow: rgba(124, 58, 237, 0.35);
  --primary-soft: rgba(124, 58, 237, 0.12);
  --primary-light: #c4b5fd;

  /* ── رنگ‌های کمکی ── */
  --success: #10b981;
  --success-soft: rgba(16, 185, 129, 0.12);
  --warning: #f59e0b;
  --warning-soft: rgba(245, 158, 11, 0.12);
  --danger: #ef4444;
  --danger-soft: rgba(239, 68, 68, 0.12);
  --gold: #fbbf24;

  /* ── متن ── */
  --text-1: #f1f5f9;
  --text-2: #94a3b8;
  --text-3: #64748b;

  /* ── مرزها ── */
  --border: rgba(148, 163, 184, 0.12);
  --border-soft: rgba(148, 163, 184, 0.06);

  /* ── گرادیان‌های پس‌زمینه ── */
  --ambient-1: rgba(124, 58, 237, 0.08);
  --ambient-2: rgba(59, 130, 246, 0.06);

  /* ── سایه‌ها ── */
  --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.35);
  --shadow-md: 0 8px 28px rgba(0, 0, 0, 0.45);
  --shadow-lg: 0 16px 56px rgba(0, 0, 0, 0.55);
  --shadow-glow: 0 0 50px var(--primary-glow);

  /* ── شعاع‌ها ── */
  --radius-sm: 10px;
  --radius: 14px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-2xl: 24px;
  --radius-full: 999px;

  /* ── Safe areas ── */
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg-primary);
  background-image:
    radial-gradient(ellipse 600px 400px at 15% -10%, var(--ambient-1), transparent 60%),
    radial-gradient(ellipse 500px 400px at 100% 20%, var(--ambient-2), transparent 55%);
  background-attachment: fixed;
  color: var(--text-1);
  font-family: 'Vazirmatn', sans-serif;
  overflow-x: hidden;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
body::before {
  content: '';
  position: fixed;
  top: -200px;
  right: -200px;
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, var(--ambient-1), transparent 70%);
  pointer-events: none;
  z-index: 0;
}
body::after {
  content: '';
  position: fixed;
  bottom: -150px;
  left: -150px;
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, var(--ambient-2), transparent 70%);
  pointer-events: none;
  z-index: 0;
}
.material-symbols-rounded {
  font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
  line-height: 1;
  vertical-align: middle;
}
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
button { font-family: inherit; cursor: pointer; }
input, textarea, select { font-family: inherit; }
a { color: inherit; text-decoration: none; }

#app { max-width: 520px; margin: 0 auto; min-height: 100vh; position: relative; padding-bottom: calc(88px + var(--safe-bottom)); }

/* ---------- Top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  padding: calc(16px + var(--safe-top)) 20px 14px;
  display: flex; align-items: center; justify-content: space-between;
  background: linear-gradient(180deg, rgba(6,9,20,.95) 0%, rgba(6,9,20,.85) 65%, rgba(6,9,20,0) 100%);
  backdrop-filter: blur(20px) saturate(1.5);
  border-bottom: 1px solid var(--border);
}
.topbar .brand { display: flex; align-items: center; gap: 14px; }
.brand-mark {
  width: 42px; height: 42px; border-radius: 14px;
  background: linear-gradient(135deg, var(--primary-bright), var(--primary), var(--primary-dim));
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 28px var(--primary-glow), inset 0 2px 10px rgba(255,255,255,.2);
  font-weight: 900; font-size: 19px;
  position: relative; overflow:hidden;
}
.brand-mark::before {
  content: ''; position: absolute; inset: -2px;
  background: linear-gradient(45deg, transparent, rgba(255,255,255,.35), transparent);
  transform: translateX(-100%); animation: shimmer 3.5s ease-in-out infinite;
}
@keyframes shimmer { to { transform: translateX(100%); }}
.brand-name {
  font-weight: 800; font-size: 19px; letter-spacing: -.02em;
  background: linear-gradient(135deg, #fff, #e0e7ff);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  text-shadow: 0 2px 10px var(--primary-glow);
}
.icon-btn {
  width: 42px; height: 42px; border-radius: var(--radius-full);
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  color: var(--text-2); position: relative;
  transition: all .2s cubic-bezier(.4,0,.2,1);
  box-shadow: var(--shadow-sm);
}
.icon-btn:active { transform: scale(.92); }
.icon-btn:hover {
  border-color: var(--primary);
  color: var(--primary-bright);
  box-shadow: 0 4px 16px var(--primary-glow);
  background: var(--bg-elevated);
}
.badge-dot {
  position: absolute; top: 9px; left: 9px; width: 9px; height: 9px; border-radius: 50%;
  background: linear-gradient(135deg, #ef4444, #dc2626);
  border: 2px solid var(--bg-primary);
  box-shadow: 0 0 16px rgba(239,68,68,.7);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.75;transform:scale(1.15);} }

/* ---------- Screens ---------- */
.screen { display: none; padding: 6px 20px 26px; animation: fadeIn .35s cubic-bezier(.2,.8,.2,1); }
.screen.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); }}

.page-title {
  font-size: 22px; font-weight: 800; letter-spacing: -.02em; margin: 10px 0 6px;
  background: linear-gradient(135deg, #fff, #e0e7ff);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  text-shadow: 0 4px 20px var(--primary-glow);
}
.page-sub { color: var(--text-2); font-size: 13px; margin: 0 0 22px; font-weight: 400; line-height: 1.6; }

/* ---------- Cards ---------- */
.card {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl); padding: 16px;
  position: relative; overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: all .2s cubic-bezier(.4,0,.2,1);
}
.card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.card + .card { margin-top: 12px; }
.glass {
  background: rgba(13, 18, 37, 0.72);
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  border: 1px solid rgba(148, 163, 184, 0.08);
  border-radius: var(--radius-2xl);
  box-shadow: inset 0 1px 2px rgba(255,255,255,.06), 0 4px 20px rgba(0,0,0,.3);
}
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat-card {
  padding: 16px;
  display: flex; flex-direction: column; gap: 12px;
  position: relative; overflow: hidden;
  background: linear-gradient(145deg, var(--bg-secondary), var(--bg-tertiary));
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
}
.stat-card::before {
  content: ''; position: absolute;
  top: 0; right: 0;
  width: 80px; height: 80px;
  background: radial-gradient(circle, var(--primary-soft), transparent 70%);
  border-radius: 50%;
  transform: translate(30%, -30%);
  pointer-events: none;
}
.stat-card::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,.03), transparent);
  opacity: 0; transition: opacity .3s ease;
}
.stat-card:hover::after { opacity: 1; }
.stat-card .stat-icon {
  width: 40px; height: 40px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  background: var(--primary-soft);
  margin-bottom: 10px;
}
.stat-card .stat-icon .material-symbols-rounded {
  font-size: 20px; color: var(--primary-bright);
}
.stat-card .stat-label {
  font-size: 11.5px; color: var(--text-3); font-weight: 600;
  margin-bottom: 4px;
}
.stat-card .stat-value {
  font-size: 20px; font-weight: 800; color: var(--text-1);
}

/* ---------- Buttons ---------- */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 14px 24px; border-radius: var(--radius); border: none;
  font-weight: 700; font-size: 14px; width: 100%;
  transition: all .2s cubic-bezier(.4,0,.2,1); position: relative; overflow: hidden;
}
.btn::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);
  transform: translateX(-100%); transition: transform .45s ease;
}
.btn:hover::before { transform: translateX(100%); }
.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--primary-dim));
  color: #fff;
  box-shadow: 0 4px 16px var(--primary-glow);
  letter-spacing: -.01em;
}
.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 24px var(--primary-glow);
}
.btn-primary:active { transform: translateY(0) scale(.97); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn-ghost {
  background: var(--bg-tertiary);
  color: var(--text-1);
  border: 1px solid var(--border);
  transition: all .2s ease;
}
.btn-ghost:hover {
  background: var(--bg-elevated);
  border-color: var(--primary-soft);
}
.btn-sm { padding: 10px 16px; font-size: 12.5px; width: auto; border-radius: var(--radius-sm); font-weight: 700; }
.btn-danger-ghost {
  background: var(--danger-soft);
  color: var(--danger);
  border: 1px solid rgba(239, 68, 68, 0.2);
  border-radius: var(--radius);
  padding: 14px 24px;
  font-size: 14px;
  font-weight: 600;
}
.btn-row { display: flex; gap: 10px; }
.btn-row .btn { flex: 1; }
.fab-plus {
  width: 26px; height: 26px; border-radius: 50%;
  background: linear-gradient(135deg, rgba(255,255,255,.25), rgba(255,255,255,.1));
  display: flex; align-items: center; justify-content: center; font-size: 17px;
  box-shadow: inset 0 2px 5px rgba(255,255,255,.15), 0 2px 8px rgba(0,0,0,.2);
}

/* ---------- Bottom nav ---------- */
.navbar {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: 72px;
  background: rgba(6, 9, 20, 0.85);
  backdrop-filter: blur(20px) saturate(1.5);
  -webkit-backdrop-filter: blur(20px) saturate(1.5);
  border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-around;
  padding: 0 8px;
  padding-bottom: env(safe-area-inset-bottom, 0);
  z-index: 50;
}
.nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 8px 12px; border-radius: 12px;
  cursor: pointer;
  transition: all .2s ease;
  position: relative;
}
.nav-item .material-symbols-rounded {
  font-size: 22px;
  color: var(--text-3);
  transition: all .2s ease;
}
.nav-item .lbl {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-3);
  transition: all .2s ease;
}
.nav-item.active {
  background: var(--primary-soft);
}
.nav-item.active .material-symbols-rounded {
  color: var(--primary-bright);
}
.nav-item.active .lbl {
  color: var(--primary-bright);
}
.nav-item:active { transform: scale(.9); }

/* ---------- Progress ring ---------- */
.ring-wrap { position: relative; width: 64px; height: 64px; }
.ring-wrap svg { transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: var(--bg-tertiary); stroke-width: 4; }
.ring-fg {
  fill: none;
  stroke: url(#timerGrad);
  stroke-width: 4;
  stroke-linecap: round;
  transform: rotate(-90deg);
  transform-origin: center;
  transition: stroke-dashoffset .6s cubic-bezier(.32,.72,0,1);
  filter: drop-shadow(0 0 6px var(--primary-glow));
}
.ring-label {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800; color: var(--text-1);
}

/* ---------- Progress bar ---------- */
.pbar {
  width: 100%; height: 8px;
  border-radius: 4px;
  background: var(--bg-tertiary);
  overflow: hidden;
}
.pbar > div {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--primary-bright));
  border-radius: 4px;
  transition: width .5s cubic-bezier(.32,.72,0,1);
}
.pbar.thin { height: 6px; }

/* ---------- Chips / tags ---------- */
.chip {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  background: var(--bg-tertiary);
  color: var(--text-2);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all .15s ease;
  white-space: nowrap;
}
.chip:hover {
  background: var(--bg-elevated);
  color: var(--text-1);
}
.chip.on {
  background: var(--primary-soft);
  color: var(--primary-bright);
  border-color: var(--primary);
}
.chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
.tag-subject {
  background: var(--primary-soft);
  color: var(--primary-bright);
  border-color: rgba(124, 58, 237, 0.3);
}
.tag-diff-easy {
  background: var(--success-soft);
  color: var(--success);
}
.tag-diff-mid {
  background: var(--warning-soft);
  color: var(--warning);
}
.tag-diff-hard {
  background: var(--danger-soft);
  color: var(--danger);
}

/* ---------- Section header ---------- */
.section-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 24px; margin-bottom: 12px;
}
.section-head h3 {
  font-size: 15px; font-weight: 800; color: var(--text-1); margin: 0;
}
.section-head .more {
  font-size: 12px; color: var(--primary-bright); font-weight: 600; cursor: pointer;
}

/* ---------- Plan item ---------- */
.plan-item {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 0;
  border-bottom: 1px solid var(--border-soft);
  transition: all .15s ease;
}
.plan-item:last-child { border-bottom: none; }
.plan-item.done { opacity: 0.5; }
.plan-item.done .plan-title { text-decoration: line-through; color: var(--text-3); }
.check-circle {
  width: 28px; height: 28px; border-radius: 50%;
  border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: all .2s ease;
  flex-shrink: 0;
}
.check-circle:hover {
  border-color: var(--primary);
  background: var(--primary-soft);
}
.check-circle.done {
  background: linear-gradient(135deg, var(--primary), var(--primary-dim));
  border-color: var(--primary);
  box-shadow: 0 0 12px var(--primary-glow);
}
.check-circle.done .material-symbols-rounded { color: white; }
.plan-title {
  font-size: 14px; font-weight: 700; color: var(--text-1); margin-bottom: 4px;
}
.plan-meta {
  display: flex; flex-wrap: wrap; gap: 10px;
  font-size: 11.5px; color: var(--text-3);
}
.plan-meta span { display: inline-flex; align-items: center; gap: 4px; }
.cat-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.cat-درسی { background: var(--primary); }
.cat-توسعه_فردی { background: var(--success); }
.cat-غیردرسی { background: var(--warning); }

/* ---------- Empty state ---------- */
.empty {
  text-align: center; padding: 40px 20px;
}
.empty .material-symbols-rounded {
  font-size: 48px; color: var(--text-3); opacity: 0.5; margin-bottom: 12px;
}
.empty p {
  font-size: 12.5px; color: var(--text-3); margin-top: 6px; line-height: 1.7;
}

/* ---------- Modal / sheet ---------- */
.overlay {
  position: fixed; inset: 0;
  background: rgba(6, 9, 20, 0.6);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 100;
  display: none;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s ease;
}
.overlay.active {
  opacity: 1;
  pointer-events: auto;
}
.sheet {
  width: 100%;
  max-width: 500px;
  max-height: 85vh;
  background: var(--bg-elevated);
  border-radius: 24px 24px 0 0;
  padding: 12px 20px 32px;
  transform: translateY(100%);
  transition: transform .3s cubic-bezier(.32,.72,0,1);
  overflow-y: auto;
  border-top: 1px solid var(--border);
}
.overlay.active .sheet {
  transform: translateY(0);
}
.sheet-handle {
  width: 36px; height: 4px;
  background: var(--text-3);
  border-radius: 2px;
  margin: 0 auto 16px;
  opacity: 0.5;
}
.sheet h2 {
  font-size: 18px; font-weight: 800; color: var(--text-1);
  margin-bottom: 20px; text-align: center;
}
.field { margin-bottom: 16px; }
.field label {
  display: block;
  font-size: 12px; font-weight: 600; color: var(--text-2);
  margin-bottom: 8px;
}
.field input, .field select, .field textarea {
  width: 100%;
  padding: 12px 14px;
  border-radius: 12px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  color: var(--text-1);
  font-size: 13.5px;
  font-family: 'Vazirmatn', sans-serif;
  transition: all .2s ease;
  outline: none;
}
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-soft);
  background: var(--bg-elevated);
}
.field textarea { resize: vertical; min-height: 100px; line-height: 1.7; }
.seg {
  display: flex;
  background: var(--bg-tertiary);
  border-radius: 12px;
  padding: 4px;
  border: 1px solid var(--border);
}
.seg button {
  flex: 1;
  padding: 10px 16px;
  border-radius: 10px;
  border: none;
  background: transparent;
  color: var(--text-2);
  font-size: 13px;
  font-weight: 600;
  font-family: 'Vazirmatn', sans-serif;
  cursor: pointer;
  transition: all .2s ease;
}
.seg button.active {
  background: var(--primary);
  color: white;
  box-shadow: 0 2px 8px var(--primary-glow);
}

/* modal for center dialogs (confirm etc) */
.overlay.center { align-items: center; }
.dialog {
  width: 90%;
  max-width: 340px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 28px 24px 24px;
  text-align: center;
  transform: scale(.9);
  opacity: 0;
  transition: all .25s cubic-bezier(.32,.72,0,1);
}
.overlay.active .dialog {
  transform: scale(1);
  opacity: 1;
}
.dialog .material-symbols-rounded.big {
  font-size: 40px;
  color: var(--primary-bright);
  margin-bottom: 12px;
}
.dialog h3 {
  font-size: 16px; font-weight: 800; color: var(--text-1);
  margin-bottom: 8px;
}
.dialog p {
  font-size: 13px; color: var(--text-2);
  line-height: 1.7; margin-bottom: 20px;
}
.dialog .btn-row { display: flex; gap: 10px; }
.dialog .btn-row .btn { flex: 1; }

/* ---------- toast ---------- */
#toast {
  position: fixed; bottom: 90px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-1);
  box-shadow: 0 8px 32px rgba(0,0,0,.4);
  opacity: 0;
  pointer-events: none;
  transition: all .3s cubic-bezier(.32,.72,0,1);
  z-index: 200;
  backdrop-filter: blur(12px);
}
#toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
  pointer-events: auto;
}
#toast .material-symbols-rounded {
  font-size: 20px;
  color: var(--success);
}

/* ---------- Timer screen ---------- */
.timer-orbit {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px 0;
  position: relative;
}
.timer-ring-wrap {
  position: relative;
  width: 240px; height: 240px;
}
.timer-ring-wrap svg {
  width: 100%; height: 100%;
  transform: rotate(-90deg);
}
.timer-ring-bg {
  fill: none; stroke: var(--bg-tertiary); stroke-width: 6;
}
.timer-ring-fg {
  fill: none;
  stroke: url(#timerGrad);
  stroke-width: 6;
  stroke-linecap: round;
  transition: stroke-dashoffset 1s linear;
  filter: drop-shadow(0 0 12px var(--primary-glow));
}
.timer-center {
  position: absolute; inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.timer-display {
  font-size: 48px; font-weight: 800;
  color: var(--text-1);
  font-variant-numeric: tabular-nums;
  letter-spacing: 2px;
  text-shadow: 0 0 20px var(--primary-glow);
}
.timer-label {
  font-size: 12px; color: var(--text-3); font-weight: 600;
  margin-top: 4px;
}
.timer-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  margin-top: 20px;
}
.timer-btn-round {
  width: 52px; height: 52px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--bg-tertiary);
  color: var(--text-2);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all .2s ease;
}
.timer-btn-round:hover {
  background: var(--bg-elevated);
  color: var(--text-1);
}
.timer-btn-round.main {
  width: 64px; height: 64px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dim));
  border: none;
  color: white;
  box-shadow: 0 4px 20px var(--primary-glow);
}
.timer-btn-round.main:hover {
  transform: scale(1.05);
  box-shadow: 0 6px 28px var(--primary-glow);
}
.timer-btn-round.main:active { transform: scale(.95); }
.mode-pills {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 16px;
}

/* ---------- Question card ---------- */
.qcard {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-bottom: 12px;
  transition: all .15s ease;
}
.qcard:active { transform: scale(.98); }
.qcard .qtext {
  font-size: 14px; font-weight: 600;
  color: var(--text-1);
  line-height: 1.8;
  margin-bottom: 12px;
}
.qcard .qopts {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 12px;
}
.qopt {
  padding: 10px 14px;
  border-radius: 10px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  font-size: 13px;
  color: var(--text-2);
}
.qopt.correct {
  background: var(--success-soft);
  border-color: rgba(16, 185, 129, 0.3);
  color: var(--success);
  font-weight: 600;
}

/* ---------- Filter bar (scrollable chips) ---------- */
.filter-scroll {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 0;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.filter-scroll::-webkit-scrollbar { display: none; }

/* ---------- Bar chart (weekly) ---------- */
.barchart {
  display: flex;
  align-items: flex-end;
  justify-content: space-around;
  gap: 8px;
  padding: 16px 8px 8px;
  min-height: 120px;
}
.barcol {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  flex: 1;
}
.bar {
  width: 100%;
  max-width: 32px;
  background: var(--bg-tertiary);
  border-radius: 8px 8px 4px 4px;
  overflow: hidden;
  position: relative;
}
.bar > div {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: linear-gradient(180deg, var(--primary-bright), var(--primary));
  border-radius: 8px 8px 4px 4px;
  transition: height .5s cubic-bezier(.32,.72,0,1);
}
.barcol.today .bar > div {
  background: linear-gradient(180deg, #c4b5fd, var(--primary));
  box-shadow: 0 0 12px var(--primary-glow);
}
.bar-label {
  font-size: 10px; color: var(--text-3); font-weight: 600;
}

/* ---------- Toggle switch ---------- */
.switch {
  position: relative;
  width: 44px; height: 24px;
  flex-shrink: 0;
}
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute; inset: 0;
  background: var(--bg-tertiary);
  border-radius: 12px;
  cursor: pointer;
  transition: all .2s ease;
  border: 1px solid var(--border);
}
.slider::before {
  content: '';
  position: absolute;
  width: 18px; height: 18px;
  left: 3px; top: 2px;
  background: var(--text-3);
  border-radius: 50%;
  transition: all .2s ease;
}
.switch input:checked + .slider {
  background: var(--primary);
  border-color: var(--primary);
}
.switch input:checked + .slider::before {
  transform: translateX(20px);
  background: white;
}

/* ---------- list row (settings/profile) ---------- */
.list-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 0;
  border-bottom: 1px solid var(--border-soft);
  cursor: pointer;
  transition: all .15s ease;
}
.list-row:last-child { border-bottom: none; }
.list-row:active { opacity: 0.7; }
.li-icon {
  width: 40px; height: 40px;
  border-radius: 12px;
  background: var(--bg-tertiary);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.li-icon .material-symbols-rounded {
  font-size: 20px; color: var(--text-2);
}
.li-body { flex: 1; min-width: 0; }
.li-title {
  font-size: 14px; font-weight: 700; color: var(--text-1);
}
.li-sub {
  font-size: 11.5px; color: var(--text-3); margin-top: 2px;
}

/* Streak days */
.streak-row {
  display: flex;
  justify-content: space-between;
  gap: 6px;
  margin-top: 12px;
}
.streak-day {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  flex: 1;
}
.streak-day .d-lbl {
  font-size: 10px; color: var(--text-3); font-weight: 600;
}
.streak-dot {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-3);
  transition: all .2s ease;
}
.streak-dot.done {
  background: var(--primary-soft);
  border-color: var(--primary);
  color: var(--primary-bright);
}
.streak-dot.today {
  background: var(--primary);
  border-color: var(--primary);
  color: white;
  box-shadow: 0 0 12px var(--primary-glow);
}

.hide { display: none !important; }
</style>
</head>
