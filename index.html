<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#060914"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="اپکس پلنر"/>
<title>اپکس پلنر — دستیار کنکور</title>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23060914'/%3E%3Cpath d='M50 20 L78 75 L60 75 L50 52 L40 75 L22 75 Z' fill='%237c3aed'/%3E%3C/svg%3E"/>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

<style>
:root{
  /* ── پس‌زمینه‌ها (Dark Glassmorphism) ── */
  --bg-primary:#060914;
  --bg-secondary:#0d1225;
  --bg-tertiary:#151b35;
  --bg-elevated:#1a2142;

  /* ── رنگ اصلی: بنفش نئونی ── */
  --primary:#7c3aed;
  --primary-bright:#a78bfa;
  --primary-dim:#5b21b6;
  --primary-light:#c4b5fd;
  --primary-glow:rgba(124,58,237,.35);
  --primary-soft:rgba(124,58,237,.12);

  /* ── رنگ‌های کمکی ── */
  --success:#10b981;
  --success-soft:rgba(16,185,129,.12);
  --success-glow:rgba(16,185,129,.35);
  --warning:#f59e0b;
  --warning-soft:rgba(245,158,11,.12);
  --warning-glow:rgba(245,158,11,.35);
  --danger:#ef4444;
  --danger-soft:rgba(239,68,68,.12);
  --danger-glow:rgba(239,68,68,.35);
  --gold:#fbbf24;

  /* ── متن ── */
  --text-1:#f1f5f9;
  --text-2:#94a3b8;
  --text-3:#64748b;

  /* ── مرزها ── */
  --border:rgba(148,163,184,.12);
  --border-soft:rgba(148,163,184,.06);

  /* ── گرادیان‌های ambient ── */
  --ambient-1:rgba(124,58,237,.1);
  --ambient-2:rgba(59,130,246,.07);

  /* ── نام‌های قدیمی (سازگاری با استایل‌های درون‌خطی در JS) ── */
  --bg:var(--bg-primary);
  --bg-grid:var(--bg-primary);
  --surface:var(--bg-secondary);
  --surface-2:var(--bg-tertiary);
  --surface-3:var(--bg-elevated);
  --surface-4:#232b4f;

  --radius-sm:14px;
  --radius:20px;
  --radius-lg:24px;
  --radius-xl:32px;
  --radius-full:999px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --shadow-sm:0 2px 10px rgba(0,0,0,.35);
  --shadow-md:0 8px 28px rgba(0,0,0,.45);
  --shadow-lg:0 16px 56px rgba(0,0,0,.55);
  --shadow-glow:0 0 50px var(--primary-glow);
  --shadow-inner:inset 0 1px 2px rgba(255,255,255,.06);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg-primary);
  color:var(--text-1);
  font-family:'Vazirmatn',sans-serif;
  overflow-x:hidden;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  position:relative;
}
body::before{
  content:'';
  position:fixed;
  top:-200px; right:-200px;
  width:560px; height:560px;
  background:radial-gradient(circle, var(--ambient-1), transparent 70%);
  pointer-events:none;
  z-index:0;
}
body::after{
  content:'';
  position:fixed;
  bottom:-160px; left:-160px;
  width:440px; height:440px;
  background:radial-gradient(circle, var(--ambient-2), transparent 70%);
  pointer-events:none;
  z-index:0;
}
.material-symbols-rounded{
  font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;
  line-height:1;
  vertical-align:middle;
}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:2px;}
button{font-family:inherit; cursor:pointer;}
input,textarea,select{font-family:inherit;}
a{color:inherit; text-decoration:none;}

#app{max-width:520px; margin:0 auto; min-height:100vh; position:relative; z-index:1; padding-bottom:calc(88px + var(--safe-bottom));}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:40;
  padding:calc(16px + var(--safe-top)) 20px 14px;
  display:flex; align-items:center; justify-content:space-between;
  background:linear-gradient(180deg, rgba(6,9,20,.96) 0%, rgba(6,9,20,.88) 65%, rgba(6,9,20,0) 100%);
  backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  border-bottom:1px solid var(--border-soft);
}
.topbar .brand{display:flex; align-items:center; gap:14px;}
.brand-mark{
  width:42px;height:42px;border-radius:14px;
  background:linear-gradient(135deg,var(--primary-bright),var(--primary),var(--primary-dim));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 28px var(--primary-glow), inset 0 2px 10px rgba(255,255,255,.2);
  font-weight:900; font-size:19px;
  position:relative; overflow:hidden;
}
.brand-mark::before{
  content:''; position:absolute; inset:-2px;
  background:linear-gradient(45deg,transparent,rgba(255,255,255,.3),transparent);
  transform:translateX(-100%); animation:shimmer 3.5s ease-in-out infinite;
}
@keyframes shimmer{to{transform:translateX(100%);}}
.brand-name{font-weight:800; font-size:19px; letter-spacing:-.02em; color:var(--text-1);}
.icon-btn{
  width:42px;height:42px;border-radius:var(--radius-full);
  display:flex;align-items:center;justify-content:center;
  background:var(--bg-tertiary);
  border:1px solid var(--border);
  color:var(--text-2); position:relative;
  transition:all .2s ease;
}
.icon-btn:active{transform:scale(.9);}
.icon-btn:hover{background:var(--bg-elevated); border-color:var(--primary-soft); color:var(--primary-bright);}
.badge-dot{
  position:absolute; top:9px; left:9px; width:9px;height:9px;border-radius:50%;
  background:var(--danger);
  border:2px solid var(--bg-primary);
  box-shadow:0 0 14px rgba(239,68,68,.6);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.75;transform:scale(1.15);}}

/* ---------- Screens ---------- */
.screen{display:none; padding:6px 20px 26px; position:relative; z-index:1;}
.screen.active{display:block; animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

.page-title{font-size:22px; font-weight:800; letter-spacing:-.01em; margin:10px 0 6px; color:var(--text-1);}
.page-sub{color:var(--text-2); font-size:13px; margin:0 0 22px; font-weight:400; line-height:1.6;}

/* ---------- Cards ---------- */
.card{
  background:var(--bg-secondary);
  border:1px solid var(--border);
  border-radius:var(--radius-lg); padding:16px;
  position:relative; overflow:hidden;
  transition:transform .2s ease, box-shadow .2s ease;
}
.card:active{transform:scale(.98);}
.card + .card{margin-top:16px;}
.glass{
  background:rgba(13,18,37,.72);
  backdrop-filter:blur(20px) saturate(140%);
  -webkit-backdrop-filter:blur(20px) saturate(140%);
  border:1px solid rgba(148,163,184,.08);
}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.stat-card{padding:16px; display:flex; flex-direction:column; gap:10px; position:relative; overflow:hidden; background:linear-gradient(145deg,var(--bg-secondary),var(--bg-tertiary));}
.stat-card::before{
  content:''; position:absolute; top:0; right:0; width:80px; height:80px;
  background:radial-gradient(circle,var(--primary-soft),transparent 70%);
  border-radius:50%; transform:translate(30%,-30%);
  pointer-events:none;
}
.stat-card .stat-icon{
  width:40px;height:40px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  background:var(--primary-soft);
  color:var(--primary-bright); font-size:20px;
  transition:transform .2s ease;
}
.stat-card:active .stat-icon{transform:scale(1.05);}
.stat-card .stat-label{font-size:11.5px; color:var(--text-3); font-weight:600;}
.stat-card .stat-value{font-size:20px; font-weight:800; color:var(--text-1);}

/* ---------- Buttons ---------- */
.btn{
  display:flex; align-items:center; justify-content:center; gap:8px;
  padding:14px 24px; border-radius:14px; border:none;
  font-weight:700; font-size:14px; width:100%;
  font-family:'Vazirmatn',sans-serif;
  transition:all .2s ease; position:relative; overflow:hidden;
}
.btn-primary{
  background:linear-gradient(135deg,var(--primary),var(--primary-dim));
  color:#fff; box-shadow:0 4px 16px var(--primary-glow);
}
.btn-primary:hover{transform:translateY(-1px); box-shadow:0 6px 24px var(--primary-glow);}
.btn-primary:active{transform:translateY(0) scale(.97);}
.btn-primary:disabled{opacity:.5; cursor:not-allowed; transform:none;}
.btn-ghost{
  background:var(--bg-tertiary);
  color:var(--text-1); border:1px solid var(--border);
  transition:all .2s ease;
}
.btn-ghost:hover{background:var(--bg-elevated); border-color:var(--primary-soft);}
.btn-sm{padding:10px 16px; font-size:12.5px; width:auto; border-radius:10px; font-weight:600;}
.btn-danger-ghost{background:var(--danger-soft); color:var(--danger); border:1px solid rgba(239,68,68,.2);}
.btn-row{display:flex; gap:10px;}
.btn-row .btn{flex:1;}
.fab-plus{
  width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;font-size:17px;
}

/* ---------- Bottom nav ---------- */
.bottomnav{
  position:fixed; bottom:0; right:0; left:0; z-index:50;
  max-width:520px; margin:0 auto;
  background:rgba(6,9,20,.85);
  backdrop-filter:blur(20px) saturate(150%);
  -webkit-backdrop-filter:blur(20px) saturate(150%);
  border-top:1px solid var(--border);
  padding:12px 8px calc(12px + var(--safe-bottom));
  display:flex; justify-content:space-around;
}
.nav-item{
  display:flex; flex-direction:column; align-items:center; gap:4px;
  padding:8px 14px; border-radius:12px; color:var(--text-3);
  background:none; border:none; flex:1;
  transition:all .2s ease; position:relative;
}
.nav-item.active{background:var(--primary-soft); color:var(--primary-bright);}
.nav-item .material-symbols-rounded{font-size:22px; transition:all .2s ease;}
.nav-item span.lbl{font-size:10px; font-weight:600; letter-spacing:.01em;}
.nav-item.active .material-symbols-rounded{color:var(--primary-bright); font-variation-settings:'FILL' 1,'wght' 600;}
.nav-item:active{transform:scale(.9);}

/* ---------- Progress ring ---------- */
.ring-wrap{position:relative; width:64px; height:64px; display:inline-flex; align-items:center; justify-content:center;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-bg{fill:none; stroke:var(--bg-tertiary); stroke-width:6;}
.ring-fg{fill:none; stroke:var(--primary-bright); stroke-width:6; stroke-linecap:round; transition:stroke-dashoffset .6s cubic-bezier(.32,.72,0,1); filter:drop-shadow(0 0 6px var(--primary-glow));}
.ring-label{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:800; color:var(--text-1);
}

/* ---------- Progress bar ---------- */
.pbar{height:8px; border-radius:4px; background:var(--bg-tertiary); overflow:hidden; position:relative;}
.pbar > div{height:100%; border-radius:4px; background:linear-gradient(90deg,var(--primary),var(--primary-bright)); transition:width .5s cubic-bezier(.32,.72,0,1);}
.pbar.thin{height:6px;}

/* ---------- Chips / tags ---------- */
.chip{
  display:inline-flex; align-items:center; gap:6px; padding:6px 14px;
  border-radius:20px; font-size:12px; font-weight:600;
  background:var(--bg-tertiary);
  color:var(--text-2); border:1px solid var(--border);
  transition:all .15s ease; white-space:nowrap;
}
.chip:hover{background:var(--bg-elevated); color:var(--text-1);}
.chip.on{background:var(--primary-soft); color:var(--primary-bright); border-color:var(--primary);}
.chip-row{display:flex; gap:8px; flex-wrap:wrap;}
.tag-subject{background:var(--primary-soft); color:var(--primary-bright); border-color:rgba(124,58,237,.3);}
.tag-diff-easy{background:var(--success-soft); color:var(--success); border-color:rgba(16,185,129,.25);}
.tag-diff-mid{background:var(--warning-soft); color:var(--warning); border-color:rgba(245,158,11,.25);}
.tag-diff-hard{background:var(--danger-soft); color:var(--danger); border-color:rgba(239,68,68,.25);}

/* ---------- Section header ---------- */
.section-head{display:flex; align-items:center; justify-content:space-between; margin:24px 0 12px;}
.section-head h3{font-size:15px; font-weight:800; margin:0; color:var(--text-1);}
.section-head .more{font-size:12px; color:var(--primary-bright); font-weight:600; transition:all .2s;}

/* ---------- Plan item ---------- */
.plan-item{
  display:flex; align-items:center; gap:14px; padding:15px;
  background:var(--bg-secondary);
  border:1px solid var(--border); border-radius:var(--radius);
  transition:all .2s ease;
}
.plan-item:active{transform:scale(.98);}
.plan-item + .plan-item{margin-top:10px;}
.check-circle{
  width:28px;height:28px;border-radius:50%; flex-shrink:0;
  border:2px solid var(--border); display:flex; align-items:center; justify-content:center;
  color:transparent; font-size:16px; transition:all .2s ease;
  background:var(--bg-tertiary); cursor:pointer;
}
.check-circle:hover{border-color:var(--primary); background:var(--primary-soft);}
.check-circle.done{
  background:linear-gradient(135deg,var(--primary),var(--primary-dim));
  border-color:var(--primary); color:#fff;
  box-shadow:0 0 12px var(--primary-glow);
  animation:checkPop .3s cubic-bezier(.4,0,.2,1);
}
@keyframes checkPop{0%{transform:scale(1);} 50%{transform:scale(1.2);} 100%{transform:scale(1);}}
.plan-item.done{opacity:.5;}
.plan-item.done .plan-title{text-decoration:line-through; color:var(--text-3);}
.plan-title{font-size:14px; font-weight:700; color:var(--text-1); margin-bottom:4px;}
.plan-meta{display:flex; flex-wrap:wrap; gap:10px; margin-top:5px; font-size:11.5px; color:var(--text-3); font-weight:500;}
.plan-meta span{display:flex; align-items:center; gap:4px;}
.cat-dot{width:8px;height:8px;border-radius:50%; flex-shrink:0; box-shadow:0 0 8px currentColor;}
.cat-درسی{background:var(--primary-bright); color:var(--primary-bright);}
.cat-توسعه_فردی{background:var(--gold); color:var(--gold);}
.cat-غیردرسی{background:var(--text-3); color:var(--text-3);}

/* ---------- Empty state ---------- */
.empty{
  text-align:center; padding:40px 20px; color:var(--text-2);
}
.empty .material-symbols-rounded{font-size:48px; color:var(--text-3); opacity:.5; margin-bottom:12px;}
.empty p{margin:6px 0 0; font-size:12.5px; color:var(--text-3); line-height:1.7;}

/* ---------- Modal / sheet ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(6,9,20,.6); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  z-index:100; display:none; align-items:flex-end; justify-content:center;
}
.overlay.active{display:flex;}
.sheet{
  width:100%; max-width:480px; background:var(--bg-elevated);
  border-radius:24px 24px 0 0; border:1px solid var(--border); border-bottom:none;
  padding:12px 20px calc(28px + var(--safe-bottom)); max-height:88vh; overflow-y:auto;
  animation:slideUp .3s cubic-bezier(.32,.72,0,1);
}
@keyframes slideUp{from{transform:translateY(100%);} to{transform:translateY(0);}}
.sheet-handle{width:36px; height:4px; background:var(--text-3); opacity:.5; border-radius:99px; margin:0 auto 16px;}
.sheet h2{font-size:18px; font-weight:800; margin:0 0 20px; color:var(--text-1); text-align:center;}
.field{margin-bottom:16px;}
.field label{display:block; font-size:12px; font-weight:600; color:var(--text-2); margin-bottom:8px;}
.field input, .field select, .field textarea{
  width:100%; padding:12px 14px; border-radius:12px;
  background:var(--bg-tertiary); border:1px solid var(--border); color:var(--text-1);
  font-size:13.5px; outline:none; transition:all .2s ease;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft); background:var(--bg-elevated);}
.field input::placeholder, .field textarea::placeholder{color:var(--text-3);}
.field textarea{resize:vertical; min-height:100px; line-height:1.7;}
.seg{display:flex; background:var(--bg-tertiary); border-radius:12px; padding:4px; gap:4px; border:1px solid var(--border);}
.seg button{
  flex:1; padding:10px 6px; border:none; background:none; border-radius:10px;
  font-size:12.5px; font-weight:600; color:var(--text-2);
  font-family:'Vazirmatn',sans-serif; transition:all .2s ease;
}
.seg button.active{background:var(--primary); color:#fff; box-shadow:0 2px 8px var(--primary-glow);}

/* modal for center dialogs (confirm etc) */
.overlay.center{align-items:center;}
.dialog{
  width:88%; max-width:340px; background:var(--bg-elevated); border:1px solid var(--border);
  border-radius:20px; padding:28px 24px 24px; text-align:center;
  transform:scale(.9); opacity:0; transition:all .25s cubic-bezier(.32,.72,0,1);
}
.overlay.active .dialog{transform:scale(1); opacity:1;}
.dialog .material-symbols-rounded.big{font-size:40px; color:var(--primary-bright); margin-bottom:12px;}
.dialog h3{font-size:16px; font-weight:800; margin:0 0 8px; color:var(--text-1);}
.dialog p{font-size:13px; color:var(--text-2); margin:0 0 20px; line-height:1.7;}

/* ---------- toast ---------- */
#toast{
  position:fixed; bottom:calc(96px + var(--safe-bottom)); left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--bg-elevated);
  border:1px solid var(--border); color:var(--text-1);
  padding:12px 20px; border-radius:14px; font-size:13px; font-weight:600;
  z-index:200; opacity:0; pointer-events:none; transition:all .3s cubic-bezier(.32,.72,0,1);
  display:flex; align-items:center; gap:10px; white-space:nowrap;
  box-shadow:0 8px 32px rgba(0,0,0,.4);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto;}
#toast .material-symbols-rounded{font-size:20px; color:var(--success);}

/* ---------- Timer screen ---------- */
.timer-orbit{position:relative; width:100%; padding:20px 0 10px; display:flex; justify-content:center;}
.timer-ring-wrap{position:relative; width:240px; height:240px;}
.timer-ring-wrap svg{transform:rotate(-90deg); width:100%; height:100%;}
.timer-ring-bg{fill:none; stroke:var(--bg-tertiary); stroke-width:6;}
.timer-ring-fg{fill:none; stroke:url(#timerGrad); stroke-width:6; stroke-linecap:round; transition:stroke-dashoffset 1s linear; filter:drop-shadow(0 0 12px var(--primary-glow));}
.timer-center{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
}
.timer-display{font-size:48px; font-weight:800; letter-spacing:2px; font-variant-numeric:tabular-nums; color:var(--text-1); text-shadow:0 0 20px var(--primary-glow);}
.timer-label{font-size:12px; color:var(--text-3); font-weight:600; margin-top:4px; letter-spacing:.3px;}
.timer-controls{display:flex; align-items:center; gap:20px; justify-content:center; margin-top:20px;}
.timer-btn-round{
  width:52px;height:52px;border-radius:50%; border:1px solid var(--border);
  background:var(--bg-tertiary);
  display:flex; align-items:center; justify-content:center; color:var(--text-2); font-size:24px;
  transition:all .2s ease;
}
.timer-btn-round:hover{background:var(--bg-elevated); color:var(--text-1);}
.timer-btn-round.main{
  width:64px;height:64px; background:linear-gradient(135deg,var(--primary),var(--primary-dim));
  box-shadow:0 4px 20px var(--primary-glow); color:#fff; font-size:30px; border:none;
}
.timer-btn-round.main:hover{transform:scale(1.05); box-shadow:0 6px 28px var(--primary-glow);}
.timer-btn-round.main:active{transform:scale(.95);}
.mode-pills{display:flex; gap:8px; justify-content:center; margin-top:16px;}

/* ---------- Question card ---------- */
.qcard{background:var(--bg-secondary); border:1px solid var(--border); border-radius:16px; padding:16px; transition:all .15s ease;}
.qcard:active{transform:scale(.98);}
.qcard + .qcard{margin-top:12px;}
.qcard .qtext{font-size:14px; font-weight:600; line-height:1.8; margin-bottom:12px; color:var(--text-1);}
.qcard .qopts{display:flex; flex-direction:column; gap:8px; margin-bottom:12px;}
.qopt{font-size:13px; color:var(--text-2); padding:10px 14px; background:var(--bg-tertiary); border-radius:10px; border:1px solid var(--border);}
.qopt.correct{border-color:rgba(16,185,129,.3); color:var(--success); background:var(--success-soft); font-weight:600;}

/* ---------- Filter bar (scrollable chips) ---------- */
.filter-scroll{display:flex; gap:8px; overflow-x:auto; padding:4px 0 4px; margin-bottom:14px; scrollbar-width:none; -ms-overflow-style:none;}
.filter-scroll::-webkit-scrollbar{display:none;}
.filter-scroll .chip{flex-shrink:0;}

/* ---------- Bar chart (weekly) ---------- */
.barchart{display:flex; align-items:flex-end; justify-content:space-around; height:140px; gap:8px; padding:16px 8px 8px;}
.barcol{display:flex; flex-direction:column; align-items:center; gap:6px; flex:1;}
.barcol .bar{width:100%; max-width:32px; border-radius:8px 8px 4px 4px; background:var(--bg-tertiary); position:relative; min-height:4px; overflow:hidden;}
.barcol .bar > div{position:absolute; bottom:0; right:0; left:0; border-radius:8px 8px 4px 4px; background:linear-gradient(180deg,var(--primary-bright),var(--primary));}
.barcol .bar-label{font-size:10px; color:var(--text-3); font-weight:600;}
.barcol.today .bar-label{color:var(--primary-bright);}
.barcol.today .bar > div{background:linear-gradient(180deg,var(--primary-light),var(--primary)); box-shadow:0 0 12px var(--primary-glow);}

/* ---------- Toggle switch ---------- */
.switch{position:relative; width:44px; height:25px; flex-shrink:0;}
.switch input{opacity:0; width:0; height:0;}
.switch .slider{position:absolute; inset:0; background:var(--bg-tertiary); border-radius:99px; transition:.2s; border:1px solid var(--border);}
.switch .slider:before{content:''; position:absolute; width:19px; height:19px; right:2px; top:2px; background:var(--text-3); border-radius:50%; transition:.2s;}
.switch input:checked + .slider{background:var(--primary); border-color:var(--primary);}
.switch input:checked + .slider:before{background:#fff; transform:translateX(-19px);}

/* ---------- list row (settings/profile) ---------- */
.list-row{display:flex; align-items:center; gap:13px; padding:14px 4px; transition:opacity .15s ease;}
.list-row:active{opacity:.7;}
.list-row + .list-row{border-top:1px solid var(--border-soft);}
.list-row .li-icon{width:36px;height:36px;border-radius:10px; background:var(--bg-tertiary); display:flex; align-items:center; justify-content:center; color:var(--text-2); font-size:19px; flex-shrink:0;}
.list-row .li-body{flex:1; min-width:0;}
.list-row .li-title{font-size:14px; font-weight:700; color:var(--text-1);}
.list-row .li-sub{font-size:11.5px; color:var(--text-3); margin-top:2px;}

/* Streak days */
.streak-row{display:flex; justify-content:space-between; gap:6px; margin-top:14px;}
.streak-day{display:flex; flex-direction:column; align-items:center; gap:6px; flex:1;}
.streak-day .d-lbl{font-size:10.5px; color:var(--text-3); font-weight:600;}
.streak-dot{width:32px;height:32px;border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; background:var(--bg-tertiary); border:1px solid var(--border); color:var(--text-3); transition:all .2s ease;}
.streak-dot.done{background:var(--primary-soft); border-color:var(--primary); color:var(--primary-bright);}
.streak-dot.today{background:var(--primary); border-color:var(--primary); color:#fff; box-shadow:0 0 12px var(--primary-glow);}

/* ---------- Shimmer (loading) ---------- */
@keyframes shimmerbg{0%{background-position:-200% 0;} 100%{background-position:200% 0;}}
.shimmer{background:linear-gradient(90deg,var(--bg-tertiary) 25%,var(--bg-elevated) 50%,var(--bg-tertiary) 75%); background-size:200% 100%; animation:shimmerbg 1.5s infinite;}

.hide{display:none !important;}

/* ---------- Responsive ---------- */
@media (min-width:500px){
  .bottomnav{max-width:520px; left:50%; transform:translateX(-50%); border-radius:20px 20px 0 0;}
}

</style>
</head>
